[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataviewer_joseph"
version = "0.1.0"
description = "Interactive geospatial timeseries data viewer for Earth observation data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Joseph Wagner", email = "joseph.wagner@geo.tuwien.ac.at" },
]
keywords = [
    "visualization",
    "timeseries",
    "maps",
    "earth-observation",
    "backscatter",
    "remote-sensing",
    "panel",
    "holoviews",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pyarrow>=12.0",
    "panel>=1.3",
    "holoviews>=1.17",
    "geoviews>=1.10",
    "bokeh>=3.3",
    "plotting_joseph[all] @ git+https://github.com/wagnerjoseph/plotting_joseph.git",
]

[project.urls]
Repository = "https://github.com/wagnerjoseph/dataviewer_joseph"
Documentation = "https://github.com/wagnerjoseph/dataviewer_joseph"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/dataviewer_joseph"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
